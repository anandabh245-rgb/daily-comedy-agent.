name: Daily Comedy Script Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "30 12 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate comedy scripts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL:  gemini-3.5-flash-lite
        run: python generate_scripts.py

      - name: Save generated scripts
        run: |
          git config user.name "Comedy Script Bot"
          git config user.email "actions@github.com"
          git add output/
          git diff --cached --quiet || git commit -m "Add daily comedy scripts"
          git push
